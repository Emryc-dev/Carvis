[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carvision-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3", "asyncpg>=0.30,<1", "alembic>=1.16,<2",
  "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3", "python-multipart>=0.0.20,<1",
  "Pillow>=11.2,<12", "orjson>=3.10,<4", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.0,<2", "aiosqlite>=0.21,<1", "respx>=0.22,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
